<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Domain Not Configured</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fff;color:#222;padding:24px;text-align:center}
.card{max-width:420px}
h1{font-size:1.2rem;margin:0 0 .5rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:#8a8a8e}
p{margin:0;line-height:1.5;color:#6e6e73}
@media (prefers-color-scheme:dark){body{background:#0b0b0c;color:#e5e5e7}h1{color:#8a8a8e}p{color:#9a9a9e}}
</style>
</head>
<body>
<div class="card">
<h1>Domain not configured</h1>
<p>No website is currently published at this address.</p>
</div>
</body>
</html>
