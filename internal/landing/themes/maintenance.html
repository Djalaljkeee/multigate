<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Maintenance</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f;padding:24px;text-align:center}
.card{max-width:420px}
h1{font-size:1.4rem;margin:0 0 .5rem;font-weight:600}
p{margin:0;line-height:1.5;color:#6e6e73}
@media (prefers-color-scheme:dark){body{background:#111113;color:#f5f5f7}p{color:#a1a1a6}}
</style>
</head>
<body>
<div class="card">
<h1>Scheduled Maintenance</h1>
<p>This site is temporarily unavailable while we perform scheduled maintenance. Please check back later.</p>
</div>
</body>
</html>
